<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1e1e2f" />
<title>🥠 Fortune Cookie · Scan for your Future</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="cookie-card" id="app">

  <!-- LOADING -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Reading your future…</p>
  </div>

  <!-- MAIN -->
  <div id="mainContent" class="main-content">

    <!-- FORTUNE -->
    <div class="quote-box">
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>

    <!-- FUN IMAGE -->
    <div class="fun-image">
      <img id="funnyImage" alt="fortune illustration" />
    </div>

    <!-- GAME -->
    <div class="game-section">
      <div class="game-title">
        🎮 Play a Game <span id="gameName"></span>
      </div>
      <div class="game-area" id="gameArea"></div>
      <div class="game-result" id="gameResult"></div>
    </div>

    <div class="scan-again">
      <div>🔒 SESSION COMPLETE</div>
      <small>Scan the QR code again for a new fortune &amp; game</small>
    </div>

  </div>
</div>

<script src="games/snake-ladder.js"></script>
<script src="games/ludo.js"></script>
<script src="games/racing.js"></script>
<script src="games/shooter.js"></script>
<script src="games/candy.js"></script>
<script src="script.js"></script>
</body>
</html>
